<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>parallel-pi-tools</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: #000;
      --white: #fff;
      --gray: #888;
      --light: #f5f5f5;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--white);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      position: relative;
    }

    /* ── staggered entrance ── */

    .fade {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s ease forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .d1 { animation-delay: 0.1s; }
    .d2 { animation-delay: 0.3s; }
    .d3 { animation-delay: 0.5s; }
    .d4 { animation-delay: 0.7s; }
    .d5 { animation-delay: 0.9s; }
    .d6 { animation-delay: 1.1s; }
    .d7 { animation-delay: 1.4s; }

    /* ── hero number ── */

    .hero {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(6rem, 18vw, 14rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1;
      position: relative;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: 0.08em;
      left: 0;
      right: 0;
      height: 0.04em;
      background: var(--black);
      transform: scaleX(0);
      animation: lineGrow 0.6s ease forwards 0.6s;
    }

    @keyframes lineGrow {
      to { transform: scaleX(1); }
    }

    .unit {
      font-size: 0.35em;
      font-weight: 300;
      letter-spacing: 0.02em;
      vertical-align: super;
      margin-left: 0.1em;
      opacity: 0;
      animation: fadeIn 0.4s ease forwards 0.9s;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ── taglines ── */

    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      color: var(--black);
      margin-top: 1.5rem;
      text-align: center;
    }

    .tagline em {
      font-style: normal;
      font-weight: 500;
    }

    .sub {
      font-size: clamp(0.8rem, 1.5vw, 1rem);
      color: var(--gray);
      margin-top: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 400;
    }

    /* ── stats row ── */

    .stats {
      display: flex;
      gap: 3rem;
      margin-top: 3rem;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards 1.2s;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 0.25rem;
    }

    /* ── bottom link ── */

    .repo {
      position: absolute;
      bottom: 2rem;
      font-size: 0.8rem;
      color: var(--gray);
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }

    .repo:hover {
      color: var(--black);
    }

    /* ── corner badge ── */

    .badge {
      position: absolute;
      top: 2rem;
      right: 2rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gray);
      border: 1px solid #ddd;
      padding: 0.35rem 0.6rem;
      border-radius: 2px;
      opacity: 0;
      animation: fadeIn 0.4s ease forwards 1.6s;
    }

    /* ── pulse ring on hero ── */

    .pulse-ring {
      position: absolute;
      width: clamp(200px, 40vw, 400px);
      height: clamp(200px, 40vw, 400px);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 50%;
      animation: pulse 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .pulse-ring:nth-child(2) {
      animation-delay: 1s;
    }

    .pulse-ring:nth-child(3) {
      animation-delay: 2s;
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="badge fade d7">v1.0.0-rc.1</div>

    <div style="position: relative; display: flex; align-items: center; justify-content: center;">
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="pulse-ring"></div>
      <div class="hero fade d1">93<span class="unit">µs</span></div>
    </div>

    <div class="tagline fade d2">The world's fastest web search for <em>Pi</em></div>
    <div class="sub fade d3">Parallel Search &amp; Extract — native tools, not MCP</div>

    <div class="stats fade d5">
      <div class="stat">
        <div class="stat-value">16×</div>
        <div class="stat-label">faster than JS</div>
      </div>
      <div class="stat">
        <div class="stat-value">88×</div>
        <div class="stat-label">faster than subprocess</div>
      </div>
      <div class="stat">
        <div class="stat-value">25</div>
        <div class="stat-label">tests passing</div>
      </div>
      <div class="stat">
        <div class="stat-value">0</div>
        <div class="stat-label">dependencies</div>
      </div>
    </div>

    <a class="repo fade d6" href="https://github.com/mdlockyer/parallel-pi-tools">github.com/mdlockyer/parallel-pi-tools</a>

  </div>
  <!-- Deployed to GitHub Pages from docs/ via .github/workflows/pages.yml on push to main -->
</body>
</html>
